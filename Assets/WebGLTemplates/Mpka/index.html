<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="theme-color" content="#140a0a">
  <title>МПКА 2 — Курчатов vs Москва</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #140a0a; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { position: fixed; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #140a0a; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #140a0a; }
    #loading h1 { margin: 0; font-size: clamp(36px, 9vw, 84px); color: #e21f19; letter-spacing: 2px; }
    #loading p { margin: 0; color: #cfc4c0; font-size: clamp(14px, 3.5vw, 20px); }
    #bar { width: min(70vw, 520px); height: 14px; background: #3a2422; border-radius: 7px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #e21f19, #ffc23d); transition: width .2s; }
    #rotate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: rgba(20, 10, 10, .96); z-index: 20; text-align: center; padding: 24px; box-sizing: border-box; }
    #rotate .icon { font-size: 64px; animation: turn 1.6s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(90deg) } }
    @media (orientation: portrait) { body.phone #rotate { display: flex; } }
    #full { position: fixed; left: 6px; top: 42%; z-index: 10; display: none; opacity: .85;
      padding: 5px 12px; border: 0; border-radius: 8px; background: #e21f19; color: #fff; font-size: 12px; font-weight: 700; }
    body.phone.ready #full { display: block; }
    #warn { position: fixed; left: 0; right: 0; top: 0; z-index: 30; }
    #warn div { padding: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="game"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading">
    <h1>МПКА 2</h1>
    <p>Курчатов vs Москва — загрузка…</p>
    <div id="bar"><div id="fill"></div></div>
    <p id="hint" style="font-size:14px;color:#8d7f7b">Первый раз грузится дольше, потом быстрее</p>
  </div>
  <div id="rotate">
    <div class="icon">📱</div>
    <div style="font-size:22px;font-weight:700">Поверни телефон боком</div>
    <div style="color:#cfc4c0">Играть удобнее горизонтально</div>
  </div>
  <button id="full">На весь экран</button>
  <div id="warn"></div>
  <script>
    var phone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    if (phone) document.body.classList.add('phone');
    var canvas = document.querySelector('#unity-canvas');
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    function showBanner(msg, type) {
      var w = document.querySelector('#warn'), d = document.createElement('div');
      d.innerHTML = msg;
      d.style.background = type == 'error' ? '#b3261e' : '#c9a227';
      w.appendChild(d);
      if (type != 'error') setTimeout(function () { w.removeChild(d); }, 5000);
    }

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: showBanner,
    };
    // на телефоне рисуем не в полном разрешении экрана — так намного быстрее
    if (phone) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

    var instance = null;
    var script = document.createElement('script');
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.querySelector('#fill').style.width = (100 * p) + '%';
      }).then(function (u) {
        instance = u;
        document.querySelector('#loading').style.display = 'none';
        document.body.classList.add('ready');
      }).catch(function (m) { alert(m); });
    };
    document.body.appendChild(script);

    document.querySelector('#full').addEventListener('click', function () {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req) {
        Promise.resolve(req.call(el)).then(function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        }).catch(function () {});
      }
      document.querySelector('#full').style.display = 'none';
    });
    document.addEventListener('fullscreenchange', function () {
      document.querySelector('#full').style.display = document.fullscreenElement ? 'none' : '';
    });
  </script>
</body>
</html>
